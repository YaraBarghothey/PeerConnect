# PeerConnect - YOUR_NAME_1 / YOUR_ID_1 , YOUR_NAME_2 / YOUR_ID_2
# PeerConnect client configuration
# serverHost: IP of the PC running the server (127.0.0.1 = same PC, LAN IP, or Tailscale/ZeroTier IP)
serverHost=127.0.0.1
serverPort=8888
# first UDP port tried for P2P chat; the next free one is used if several clients run on the same PC
udpPortBase=6000
pingIntervalSeconds=5
serverTimeoutSeconds=15
defaultUsername=
