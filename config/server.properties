# PeerConnect - YOUR_NAME_1 / YOUR_ID_1 , YOUR_NAME_2 / YOUR_ID_2
# PeerConnect server configuration
# bindIp: 0.0.0.0 = all interfaces (LAN / Tailscale / ZeroTier), 127.0.0.1 = this PC only
bindIp=0.0.0.0
port=8888
# accounts file is looked up inside this config folder
accountsFile=accounts.txt
# heartbeat timeout in seconds (clients send PING every 5 s)
timeoutSeconds=15
